      ctx.fillStyle = "rgba(255,70,50," + (state.hurt * 0.3).toFixed(3) + ")";
      ctx.fillRect(view.x - 2, view.y - 2, view.w + 4, view.h + 4);
    }
    if (wisp.dead > 0) {
      ctx.fillStyle = "rgba(0,0,0," + clamp(wisp.dead * 0.5, 0, 0.7) + ")";
      ctx.fillRect(view.x - 2, view.y - 2, view.w + 4, view.h + 4);
      ctx.fillStyle = "rgba(255,240,220,0.85)";
      ctx.font = "600 15px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("your light gutters…", VW / 2, VH / 2);
      ctx.font = "500 11px -apple-system, system-ui, sans-serif";
      ctx.fillStyle = "rgba(255,240,220,0.5)";
      ctx.fillText("what you bloomed stays bloomed", VW / 2, VH / 2 + 20);
    }
  }

  function drawCompass(t) {
    var tx, ty, isGate = false;
    if (world.frac >= GATE_REQ && !world.gate.taken) {
      tx = world.gate.x; ty = world.gate.y - 60; isGate = true;
    } else {
      var best = Infinity;
      for (var i = 0; i < world.nodes.length; i++) {
        var n = world.nodes[i];
        if (n.bloomed) continue;
        var d = dist2(n.x, n.y, wisp.x, wisp.y);
        if (d < best) { best = d; tx = n.x; ty = n.y; }
      }
      if (tx === undefined) return;
    }
    // already on screen? no need to point
    var sx = VW / 2 + (tx - cam.x), sy = VH / 2 + (ty - cam.y);
    if (sx > view.x + 26 && sx < view.x + view.w - 26 && sy > view.y + 70 && sy < view.y + view.h - 40) return;

    var cx = VW / 2, cy = VH / 2;
    var ang = Math.atan2(ty - cam.y, tx - cam.x);
    var rx = view.w / 2 - 26, ry = view.h / 2 - 60;
    var px = cx + Math.cos(ang) * Math.min(rx, ry * Math.abs(Math.cos(ang) / Math.max(0.001, Math.abs(Math.sin(ang)))) || rx);
    // simpler: clamp along the ellipse
    px = cx + Math.cos(ang) * rx;
    var py = cy + Math.sin(ang) * ry;

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(ang);
    var col = isGate ? world.def.heaven.accent : [255, 240, 210];
    var a = 0.35 + 0.3 * Math.sin(t * 3);
    ctx.fillStyle = css(col, a);
    ctx.beginPath();
    ctx.moveTo(9, 0); ctx.lineTo(-5, 5.5); ctx.lineTo(-5, -5.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // ---- cards -----------------------------------------------------------
  function drawIntroCard() {
    screenTransform();
    var a = clamp(state.cardT < 0.5 ? state.cardT / 0.5 : (3.6 - state.cardT) / 0.7, 0, 1);
    if (state.cardT > 90) a = 0;
    if (a <= 0) return;
    ctx.fillStyle = "rgba(6,4,7," + (0.72 * a) + ")";
    ctx.fillRect(view.x - 2, view.y - 2, view.w + 4, view.h + 4);
    var cx = VW / 2, cy = VH / 2;
    ctx.textAlign = "center";
    ctx.fillStyle = css(world.def.hell.accent, a);
    ctx.font = "300 56px Georgia, 'Times New Roman', serif";
    ctx.fillText(world.def.numeral, cx, cy - 40);
    ctx.fillStyle = "rgba(255,255,255," + (0.95 * a) + ")";
    ctx.font = "700 22px -apple-system, system-ui, sans-serif";
    ctx.fillText(world.def.name.toUpperCase(), cx, cy + 2);
    ctx.fillStyle = "rgba(255,255,255," + (0.7 * a) + ")";
    ctx.font = "italic 400 14px Georgia, serif";
    ctx.fillText(world.def.place, cx, cy + 26);
    ctx.fillStyle = "rgba(255,255,255," + (0.5 * a) + ")";
    ctx.font = "400 12px -apple-system, system-ui, sans-serif";
    wrapText(world.def.line, cx, cy + 58, 250, 17, a * 0.6, [255, 255, 255]);
  }

  function wrapText(text, cx, y, maxW, lh, alpha, col) {
    var words = text.split(" "), line = "", lines = [];
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + " " + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    ctx.fillStyle = css(col || [255, 255, 255], alpha);
    for (var j = 0; j < lines.length; j++) ctx.fillText(lines[j], cx, y + j * lh);
  }

  function drawCompleteCard(t) {
    screenTransform();
    var a = clamp(state.cardT / 0.8, 0, 1);
    ctx.fillStyle = "rgba(4,6,8," + (0.6 * a) + ")";
    ctx.fillRect(view.x - 2, view.y - 2, view.w + 4, view.h + 4);
    var cx = VW / 2, cy = VH / 2;
    ctx.textAlign = "center";
    var full = world.bloomed >= world.nodes.length;
    ctx.fillStyle = css(world.def.heaven.accent, a);
    ctx.font = "300 44px Georgia, serif";
    ctx.fillText(world.def.numeral, cx, cy - 60);
    ctx.fillStyle = "rgba(255,255,255," + (0.95 * a) + ")";
    ctx.font = "700 24px -apple-system, system-ui, sans-serif";
    ctx.fillText(full ? "WHOLLY REDEEMED" : "REDEEMED", cx, cy - 18);
    ctx.font = "500 14px -apple-system, system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255," + (0.72 * a) + ")";
    ctx.fillText(world.bloomed + " of " + world.nodes.length + " bloomed", cx, cy + 10);
    if (!full) {
      ctx.font = "400 11px -apple-system, system-ui, sans-serif";
      ctx.fillStyle = "rgba(255,255,255," + (0.4 * a) + ")";
      ctx.fillText("some of it is still dark", cx, cy + 30);
    }
    ctx.font = "600 12px -apple-system, system-ui, sans-serif";
    ctx.fillStyle = css(world.def.heaven.accent, a * (0.55 + 0.35 * Math.sin(t * 3)));
    var last = world.idx >= CIRCLES.length - 1;
    ctx.fillText(last ? "TAP TO REACH THE BOTTOM" : "TAP TO GO DEEPER", cx, cy + 72);
  }

  var titleParts = [];
  function drawTitle(t) {
    screenTransform();
    var g = ctx.createLinearGradient(0, view.y, 0, view.y + view.h);
    g.addColorStop(0, "#0a0710");
    g.addColorStop(0.55, "#241018");
    g.addColorStop(1, "#5a2216");
    ctx.fillStyle = g;
    ctx.fillRect(view.x - 2, view.y - 2, view.w + 4, view.h + 4);

    // embers rising
    if (Math.random() < 0.5) {
      titleParts.push({ x: view.x + Math.random() * view.w, y: view.y + view.h + 10,
        vy: -18 - Math.random() * 32, vx: (Math.random() - 0.5) * 14, life: 6, max: 6,
        s: 1 + Math.random() * 1.8 });
    }
    for (var i = titleParts.length - 1; i >= 0; i--) {
      var p = titleParts[i];
      p.life -= 1 / 60; p.x += p.vx / 60; p.y += p.vy / 60;
      if (p.life <= 0) { titleParts.splice(i, 1); continue; }
      var pa = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = "rgba(255," + (150 + 80 * pa | 0) + ",90," + (pa * 0.6) + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 6.2832); ctx.fill();
    }
    if (titleParts.length > 200) titleParts.splice(0, 40);

    var cx = VW / 2, cy = VH / 2;

    // one rose blooming and un-blooming, slowly
    var k = (Math.sin(t * 0.5) + 1) / 2;
    ctx.save();
    ctx.translate(cx, cy - 46);
    var rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 90);
    rg.addColorStop(0, "rgba(255,214,180," + (0.30 * k + 0.06) + ")");
    rg.addColorStop(1, "rgba(255,180,140,0)");
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(0, 0, 90, 0, 6.2832); ctx.fill();
    var sc = 0.6 + 0.6 * k;
    for (var L = 4; L >= 1; L--) {
      var rr = 8 * L * sc;
      petalRing(5, rr * 0.25, rr, rr * 0.42,
        mix([120, 40, 46], [255, 226, 232], k * (4 - L) * 0.24 + k * 0.2), L * 0.7, 0.95);
    }
    ctx.restore();

    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,244,232,0.96)";
    ctx.font = "300 40px Georgia, 'Times New Roman', serif";
    ctx.fillText("NINE BLOOMS", cx, cy + 62);
    ctx.fillStyle = "rgba(255,220,200,0.55)";
    ctx.font = "italic 400 13px Georgia, serif";
    ctx.fillText("nothing lives down here yet", cx, cy + 88);

    ctx.fillStyle = "rgba(255,255,255," + (0.35 + 0.3 * Math.sin(t * 2.4)) + ")";
    ctx.font = "600 13px -apple-system, system-ui, sans-serif";
    var label = (save.seen && save.deepest > 0)
      ? "TAP TO RETURN TO CIRCLE " + CIRCLES[save.deepest].numeral
      : "TAP TO DESCEND";
    ctx.fillText(label, cx, cy + 150);

    if (save.total > 0) {
      ctx.fillStyle = "rgba(255,255,255,0.28)";
      ctx.font = "500 11px -apple-system, system-ui, sans-serif";
      ctx.fillText(save.total + " blooms, all told", cx, view.y + view.h - safeBottom - 22);
    }

    // mute button on the title too
    var mb = muteButtonRect();
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.font = "13px -apple-system, system-ui, sans-serif";
    ctx.fillText(save.muted ? "🔇" : "🔊", mb.x, mb.y + 4);
  }

  function drawEnding(t) {
    screenTransform();
    var g = ctx.createLinearGradient(0, view.y, 0, view.y + view.h);
    g.addColorStop(0, "#bfe0f2");
    g.addColorStop(0.5, "#f6efdc");
    g.addColorStop(1, "#cfe6c4");
    ctx.fillStyle = g;
    ctx.fillRect(view.x - 2, view.y - 2, view.w + 4, view.h + 4);

    if (Math.random() < 0.6) {
      titleParts.push({ x: view.x + Math.random() * view.w, y: view.y - 10,
        vy: 14 + Math.random() * 20, vx: (Math.random() - 0.5) * 20, life: 9, max: 9,
        s: 1.6 + Math.random() * 2 });
    }
    for (var i = titleParts.length - 1; i >= 0; i--) {
      var p = titleParts[i];
      p.life -= 1 / 60;
      p.x += (p.vx + Math.sin((t + p.life) * 2) * 12) / 60;
      p.y += p.vy / 60;
      if (p.life <= 0) { titleParts.splice(i, 1); continue; }
      var pa = clamp(p.life / p.max, 0, 1);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.life * 2);
      ctx.fillStyle = "rgba(255," + (200 + 40 * pa | 0) + ",220," + (pa * 0.8) + ")";
      ctx.beginPath();
      ctx.ellipse(0, 0, p.s * 1.8, p.s * 0.9, 0, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    }

    var cx = VW / 2, cy = VH / 2;
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(52,44,38,0.92)";
    ctx.font = "300 30px Georgia, serif";
    ctx.fillText("ALL NINE", cx, cy - 168);
    ctx.font = "italic 400 13px Georgia, serif";
    wrapText("Every circle is a garden now. There is still no one here — but there is somewhere to arrive.",
      cx, cy - 140, 240, 18, 0.7, [52, 44, 38]);

    // nine numerals in a wreath
    for (var n = 0; n < 9; n++) {
      var an = -1.5708 + (n / 9) * 6.2832;
      var px = cx + Math.cos(an) * 74, py = cy - 6 + Math.sin(an) * 74;
      petalRingAt(px, py, 6, 2, 12, 4.4, mix([255, 214, 226], [255, 244, 200], n / 9), t * 0.3 + n, 0.95);
      ctx.fillStyle = "rgba(70,58,50,0.9)";
      ctx.font = "600 10px Georgia, serif";
      ctx.fillText(CIRCLES[n].numeral, px, py + 3.5);
    }

    ctx.fillStyle = "rgba(52,44,38,0.85)";
    ctx.font = "600 13px -apple-system, system-ui, sans-serif";
    ctx.fillText(save.total + " blooms in all", cx, cy + 112);
    ctx.fillStyle = "rgba(52,44,38," + (0.35 + 0.35 * Math.sin(t * 2.4)) + ")";
    ctx.font = "600 12px -apple-system, system-ui, sans-serif";
    ctx.fillText("TAP TO BEGIN AGAIN", cx, cy + 144);
  }

  // =========================================================================
  // Frame
  // =========================================================================
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (state.mode === "title") { drawTitle(state.t); }
    else if (state.mode === "ending") { drawEnding(state.t); }
    else if (world) {
      var P = pal();
      drawSky(P);
      ridge(view.y + view.h * 0.62, 26, 0.004, 1.1, 0.22, mix(P.far, P.sky1, 0.35), 0.55);
      ridge(view.y + view.h * 0.72, 34, 0.0065, 2.4, 0.42, P.far, 0.7);
      ridge(view.y + view.h * 0.84, 30, 0.0091, 0.6, 0.62, P.mid, 0.85);

      worldTransform();
      drawTerrain(P);
      drawGate(P, state.t);
      drawHazards(P, state.t);
      drawNodes(P, state.t);
      drawProjectiles(P);
      drawParticles();
      drawPulses();
      drawWisp(P, state.t);

      drawDarkness(P);
      drawHUD(P, state.t);
      if (state.mode === "intro") drawIntroCard();
      if (state.mode === "complete") drawCompleteCard(state.t);
    }

    if (state.fade > 0.002) {
      screenTransform();
      ctx.fillStyle = "rgba(0,0,0," + state.fade.toFixed(3) + ")";
      ctx.fillRect(view.x - 4, view.y - 4, view.w + 8, view.h + 8);
    }
  }

  var last = 0;
  function frame(now) {
    if (!last) last = now;
    var dt = Math.min((now - last) / 1000, 1 / 24);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) last = 0;
  });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
