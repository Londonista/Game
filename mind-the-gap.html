<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#160f1e">
<title>Mind the Gap 🚇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#efe6f2; --ink-dim:#b9a7c9; --plum:#160f1e; --rose:#e77fa4; --moon:#f6ecd2; --amber:#e8b45c; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    min-height:100%;
    background:linear-gradient(180deg,#221533 0%,#1a1026 45%,#100a16 100%);
    color:var(--ink); font-family:"Cormorant Garamond", Georgia, serif;
  }
  body{
    overflow-x:hidden; position:relative;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 14px calc(env(safe-area-inset-bottom,0px) + 28px);
    display:flex; flex-direction:column; align-items:center;
  }
  .stars{ content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.45;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, #efe6f2 50%, transparent 51%),
      radial-gradient(1px 1px at 68% 9%,  #efe6f2 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 84% 26%, #efe6f2 50%, transparent 51%),
      radial-gradient(1px 1px at 35% 7%,  #efe6f2 50%, transparent 51%),
      radial-gradient(1px 1px at 52% 22%, #efe6f2 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 22% 34%, #efe6f2 50%, transparent 51%);
    animation:twinkle 3.4s ease-in-out infinite alternate; }
  @keyframes twinkle{ from{opacity:.2} to{opacity:.55} }

  header{ z-index:1; text-align:center; margin-bottom:14px; }
  .fleuron{ color:var(--rose); letter-spacing:8px; font-size:15px; }
  h1{ font-family:"IM Fell English", Georgia, serif; font-weight:400;
    font-size:clamp(28px,8vw,40px); color:var(--moon); text-shadow:0 0 18px rgba(246,236,210,.3); margin:6px 0 2px; }
  header p{ font-style:italic; color:var(--ink-dim); font-size:16px; }

  /* the cabinet the game sits in */
  .cab{ z-index:1; width:100%; max-width:520px;
    background:linear-gradient(170deg, rgba(36,23,51,.94), rgba(20,12,29,.96));
    border:1px solid rgba(231,127,164,.32); border-radius:16px;
    padding:14px; box-shadow:0 10px 40px rgba(0,0,0,.55); }
  .screen-wrap{ position:relative; border-radius:8px; overflow:hidden; background:#07140e;
    box-shadow:inset 0 0 22px rgba(0,0,0,.75); }
  canvas{ display:block; width:100%; height:auto; image-rendering:pixelated; background:#0b0714; }
  .scan{ position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); }

  .hint{ text-align:center; font-style:italic; color:var(--ink-dim); font-size:15px; margin-top:10px; line-height:1.35; }
  .bar{ display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap; justify-content:center; }
  .best{ font-family:"IM Fell English", Georgia, serif; color:var(--amber); font-size:17px; }
  button.b{ font-family:"Cormorant Garamond", Georgia, serif; font-size:16px; cursor:pointer;
    color:var(--ink); background:rgba(231,127,164,.12); border:1px solid rgba(231,127,164,.34);
    border-radius:999px; padding:5px 15px 6px; transition:transform .1s ease, background .12s; }
  button.b:hover{ background:rgba(231,127,164,.22); }
  button.b:active{ transform:scale(.96); }

  a.back{ z-index:1; margin-top:20px; color:var(--ink-dim); text-decoration:none;
    font-style:italic; font-size:16px; border-bottom:1px dotted rgba(185,167,201,.5); }
  a.back:hover{ color:var(--moon); }
  footer{ z-index:1; margin-top:16px; text-align:center; font-style:italic;
    color:rgba(185,167,201,.6); font-size:13px; max-width:460px; line-height:1.45; }
</style>
</head>
<body>
  <div class="stars"></div>

  <header>
    <div class="fleuron">❦ 🚇 ❦</div>
    <h1>Mind the Gap</h1>
    <p>getting on in london &middot; est. 1984</p>
  </header>

  <div class="cab">
    <div class="screen-wrap">
      <canvas id="gameCanvas" width="320" height="240"></canvas>
      <div class="scan"></div>
    </div>
    <p class="hint" id="hint">Tap / space to jump. Collect the pay, dodge the costs &mdash; and note how the two modes differ.</p>
    <div class="bar">
      <span class="best" id="best">best &pound;0</span>
      <button class="b" id="btnMute">&#128266; sound</button>
      <button class="b" id="btnRestart">&#8635; restart</button>
    </div>
  </div>

  <a class="back" href="index.html">&larr; back to the parlour</a>
  <footer>Nine levels. The last six are a tower, arranged after Dante.<br>Nobody has ever beaten the glass ceiling on the first go.</footer>

<script>
(function () {
  "use strict";
  var canvas = document.getElementById("gameCanvas"), ctx = canvas.getContext("2d");
  var W = 320, H = 240, game = null, raf = null, running = false, inputBound = false;

  // ---- best score, kept between visits ----
  var BEST_KEY = "mindTheGap.best";
  function getBest() { try { return parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { return 0; } }
  function setBest(n) { try { localStorage.setItem(BEST_KEY, String(n)); } catch (e) {} }
  function paintBest() { document.getElementById("best").innerHTML = "best &pound;" + getBest().toLocaleString(); }

  // ---- a very small sound box: the game only ever asks for blips ----
  var Ambient = (function () {
    var ac = null, muted = false;
    try { muted = localStorage.getItem("mindTheGap.muted") === "1"; } catch (e) {}
    function ctxOf() {
      if (muted) return null;
      if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === "suspended") ac.resume();
      return ac;
    }
    function blip(freq, dur, type) {
      var c = ctxOf(); if (!c) return;
      var t = c.currentTime, o = c.createOscillator(), g = c.createGain();
      o.type = type || "square"; o.frequency.value = freq || 440;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.08));
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + (dur || 0.08) + 0.02);
    }
    function toggle() {
      muted = !muted;
      try { localStorage.setItem("mindTheGap.muted", muted ? "1" : "0"); } catch (e) {}
      paintMute();
    }
    function paintMute() {
      document.getElementById("btnMute").innerHTML = muted ? "&#128263; muted" : "&#128266; sound";
    }
    return { blip: blip, toggle: toggle, paintMute: paintMute, isMuted: function () { return muted; } };
  })();

  // In the house this paid out coins. Out here the run is its own reward,
  // so the only thing kept is how much you walked away with.
  function award() {}
  // ===== Game 3: Mind the Gap — a vintage runner about "getting on" =====
  // A stressed man in a shirt and tie runs at a London tower with a pound on it.
  // WORKER MODE makes you earn every inch of the climb; RIGGED MODE hands it
  // to you. The joke is that only one of them is difficult.
  function AntiCap(onOver) {
    var GROUND = 190, PX = 56, PW = 16, PH = 30;
    var scr, mode, lv, tick, money, dist, spawnT, items, py, vy, hurtT, over, awarded, msg, msgT, phase, flashT;
    var cut, cutT, cutLine, ceilHit, ceilCracks;
    var LEVELS = [
      { title: "LEVEL 1 — THE DEGREE",
        lines: ["Across the river: a tower with a pound on it.",
                "You want in. First, they say, get a degree.",
                "Mind the tuition. Mind the fares."],
        goal: 2200, drain: 0.038, gap: 66, spd: 2.6, coin: 14,
        haz: ["TUITION £9,250", "RAIL REPLACEMENT", "TEXTBOOK £60", "OVERDRAFT"] },
      { title: "LEVEL 2 — THE JOB HUNT",
        lines: ["Degree in hand. The tower looks no nearer.",
                "Nine hundred applications. Four replies.",
                "Dodge the rejections — the unpaid ones bite."],
        goal: 2600, drain: 0.052, gap: 58, spd: 2.9, coin: 14,
        haz: ["UNPAID INTERN", "GHOSTED", "NO EXPERIENCE", "GRAD SCHEME: NO"] },
      { title: "LEVEL 3 — THE OFFER",
        lines: ["An offer! Below advertised, but an offer.",
                "Sign here, here, and here. And here.",
                "Rent rises rather faster than you do."],
        goal: 2800, drain: 0.066, gap: 52, spd: 3.1, coin: 13,
        haz: ["RENT +30%", "ZONE 1 FARE", "ENERGY BILL", "COUNCIL TAX"] },
      { title: "FLOOR I — THE COMMUTE",
        inscr: "\u201cthrough me the way into the suffering city\u201d",
        lines: ["You're in. The tower is across the city.",
                "Ninety minutes each way, unpaid.",
                "The ferryman now takes contactless."],
        goal: 2900, drain: 0.07, gap: 50, spd: 3.2, coin: 12,
        haz: ["RUSH HOUR", "TRAFFIC JAM", "SIGNAL FAILURE", "DELAYED 42 MIN", "NO SEATS"] },
      { title: "FLOOR II — ONBOARDING",
        inscr: "\u201cabandon hope, all ye who onboard here\u201d",
        lines: ["HR would like a quick informal chat.",
                "It is neither quick nor informal.",
                "Virgil from IT says just nod along."],
        goal: 3000, drain: 0.075, gap: 48, spd: 3.3, coin: 12, interior: true, goalArt: "lift",
        haz: ["HR 'QUICK CHAT'", "CULTURE FIT", "COMPULSORY FUN", "SIGN THE NDA", "MANDATORY SMILE"] },
      { title: "FLOOR III — MIDDLE MANAGEMENT",
        inscr: "\u201chere the incompetent and the cunning are mixed together\u201d",
        lines: ["One manager cannot work the projector.",
                "The other remembers everything you say.",
                "Both agree you are 'not quite ready'."],
        goal: 3100, drain: 0.08, gap: 46, spd: 3.4, coin: 11, interior: true, goalArt: "lift",
        haz: ["QUICK CATCH-UP", "LET'S CIRCLE BACK", "WE'RE A FAMILY", "CREDIT TAKEN", "6PM 'URGENT'"] },
      { title: "FLOOR IV — THE OPEN PLAN",
        inscr: "\u201cno walls, and therefore nowhere to hide\u201d",
        lines: ["Hot desks. Cold comments. Warm lager after.",
                "Everything is fine and everyone is lovely,",
                "and you are asked where you're really from."],
        goal: 3200, drain: 0.085, gap: 44, spd: 3.5, coin: 10, interior: true, goalArt: "lift",
        haz: ["'WHERE ARE YOU FROM?'", "'CALM DOWN'", "'SO ARTICULATE'", "NAME MISPRONOUNCED", "'JUST BANTER'"] },
      { title: "FLOOR V — THE RESTRUCTURE",
        inscr: "\u201cthe firm is not making cuts; it is becoming agile\u201d",
        lines: ["An all-hands has appeared in your calendar.",
                "The slide says SYNERGY. Nobody is smiling.",
                "Keep running. Hand your laptop in on the way."],
        goal: 3300, drain: 0.09, gap: 42, spd: 3.6, coin: 10, interior: true, goalArt: "lift",
        haz: ["RIGHT-SIZING", "ALL-HANDS 4PM", "LAPTOP RETURNED", "'EXCITING NEWS'", "SYNERGY"] },
      { title: "FLOOR VI — THE GLASS CEILING",
        inscr: "\u201cand thence we came forth, to see \u2014 no, we did not\u201d",
        lines: ["The top floor is directly above you.",
                "You can see it. That is the entire point.",
                "Jump all you like. The glass is load-bearing."],
        goal: 3200, drain: 0.082, gap: 48, spd: 3.5, coin: 12, interior: true, goalArt: "lift", ceil: 112,
        haz: ["'NOT READY YET'", "'NEXT CYCLE'", "'BE PATIENT'", "'CULTURE FIT'", "'WE PROMOTED DAN'"] }
    ];
    var RIGGED = { title: "RIGGED MODE — THE SHORTCUT",
      lines: ["You started on the top floor. You always were.",
              "Doors open. Fares are somebody else's problem.",
              "Enjoy the run. It was never a race."],
      goal: 2200, drain: 0, gap: 70, spd: 4.2, coin: 14,
      haz: ["TAX BREAK", "NON-DOM", "TRUST FUND", "THE RIGHT SCHOOL"] };
  
    // Between levels the telly comes on and somebody explains your failure.
    var CUTS = {
      0:        { tag: "THE SIX O'CLOCK NEWS", kind: "news",
        ticker: "HOUSE PRICES UP 14%  ·  WAGES FLAT  ·  MAN WHO INHERITED HOME URGES YOUNG TO TRY HARDER  ·  ",
        lines: [ ["p", "Why can't young people buy a home?"],
                 ["g", "Avocado toast, I'm afraid."],
                 ["g", "In my day, one simply worked."],
                 ["g", "Bought my first house at twenty-one."],
                 ["p", "For three thousand pounds, sir."],
                 ["g", "They must simply TRY HARDER!"] ] },
      1: { tag: "THE GRINDSET POD  ·  EP. 412", kind: "pod",
        ticker: "NOT FINANCIAL ADVICE  ·  NOT FINANCIAL ADVICE  ·  NOT FINANCIAL ADVICE  ·  ",
        lines: [ ["h", "Millionaire at twenty-six. Ask me how."],
                 ["h", "4AM. Ice bath. Zero excuses."],
                 ["h", "While you slept, I bought SIGMACOIN."],
                 ["h", "Anyone can do this. It's a mindset."],
                 ["s", "* seed capital: dad's second flat"] ] },
      7: { tag: "ALL-HANDS  ·  LIVE FROM THE 40TH FLOOR", kind: "news",
        ticker: "RECORD PROFITS  ·  HEADCOUNT OPTIMISED  ·  CEO PAY UP 41%  ·  FREE PASTRIES FRIDAY  ·  ",
        lines: [ ["p", "Is the company in trouble?"],
                 ["g", "Quite the opposite — record profits!"],
                 ["g", "Which is why we must all sacrifice."],
                 ["g", "Some of you are being freed up."],
                 ["p", "You mean made redundant."],
                 ["g", "We mean there'll be pastries on Friday."] ] }
    };
    var CUT_HOLD = 116;                                              // frames per line
  
    function conf() { return mode === "rigged" ? RIGGED : LEVELS[lv]; }
    function rnd1(n) { var x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }
  
    function reset() { scr = "title"; mode = null; lv = 0; tick = 0; over = false; awarded = false; phase = 0; }
    function beginLevel() {
      var c = conf();
      tick = 0; dist = 0; spawnT = 30; items = [];
      py = GROUND - PH; vy = 0; hurtT = 0; flashT = 0; msg = ""; msgT = 0; ceilHit = 0; ceilCracks = 0;
      money = mode === "rigged" ? 1000000 : 120;
      scr = "play";
    }
    function say(t) { msg = t; msgT = 70; }
    function jump() {
      if (py >= GROUND - PH - 0.5) { vy = -6.5; Ambient.blip(420, 0.06, "square"); }
    }
    function finish(won) {
      over = true; scr = won ? "win" : "bust";
      if (!awarded) {
        awarded = true;
        var s = Math.max(0, Math.round(money / (mode === "rigged" ? 1000 : 1)));
        award(Math.floor(s / 40));
        if (onOver) onOver("anticap", s);
      }
    }
  
    // ---------- painting ----------
    function sky() {
      var g = ctx.createLinearGradient(0, 0, 0, GROUND);
      if (mode === "rigged") { g.addColorStop(0, "#2b1c50"); g.addColorStop(0.55, "#8a4f86"); g.addColorStop(1, "#e8a05c"); }
      else { g.addColorStop(0, "#1b2338"); g.addColorStop(0.5, "#4c4a6a"); g.addColorStop(1, "#c98a6a"); }
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // sun for the lucky, a hazy streetlight moon for everyone else
      ctx.fillStyle = mode === "rigged" ? "rgba(255,236,190,.55)" : "rgba(226,226,236,.3)";
      ctx.beginPath(); ctx.arc(W * 0.72, GROUND - 54, 26, 0, 7); ctx.fill();
    }
    // a few London silhouettes drifting behind everything
    function landmarks(off, base, col) {
      var set = [[10, "shard"], [120, "gherkin"], [212, "stpauls"], [330, "bigben"]], span = 430;
      ctx.fillStyle = col;
      for (var i = 0; i < set.length; i++) {
        for (var rep = 0; rep < 2; rep++) {
          var x = ((set[i][0] - off) % span + span) % span - 70 + rep * span;
          if (x < -80 || x > W + 40) continue;
          var t = set[i][1];
          if (t === "shard") {
            ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x + 8, base - 92);
            ctx.lineTo(x + 12, base - 104); ctx.lineTo(x + 16, base - 92); ctx.lineTo(x + 24, base);
            ctx.closePath(); ctx.fill();
          } else if (t === "gherkin") {
            ctx.beginPath(); ctx.moveTo(x, base);
            ctx.quadraticCurveTo(x - 3, base - 42, x + 10, base - 66);
            ctx.quadraticCurveTo(x + 23, base - 42, x + 20, base); ctx.closePath(); ctx.fill();
          } else if (t === "stpauls") {
            ctx.fillRect(x, base - 26, 36, 26);
            ctx.beginPath(); ctx.arc(x + 18, base - 28, 13, Math.PI, 0); ctx.fill();
            ctx.fillRect(x + 16, base - 52, 3.5, 10); ctx.fillRect(x + 13, base - 48, 9, 3);
          } else {
            ctx.fillRect(x, base - 72, 14, 72);
            ctx.beginPath(); ctx.moveTo(x - 1.5, base - 72); ctx.lineTo(x + 7, base - 90);
            ctx.lineTo(x + 15.5, base - 72); ctx.closePath(); ctx.fill();
            var keep = ctx.fillStyle;
            ctx.fillStyle = "rgba(240,224,160,.75)";
            ctx.beginPath(); ctx.arc(x + 7, base - 60, 4.2, 0, 7); ctx.fill();
            ctx.fillStyle = keep;
          }
        }
      }
    }
    function drizzle(t) {                                            // it is, of course, raining
      ctx.strokeStyle = "rgba(206,222,255,.26)"; ctx.lineWidth = 1;
      for (var i = 0; i < 44; i++) {
        var rx = (i * 61 + t * 4.5) % (W + 40) - 20;
        var ry = (i * 43 + t * 12) % (H + 30) - 15;
        ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 3, ry + 9); ctx.stroke();
      }
    }
    function skyline(off, base, tall, col, seed, lit) {
      ctx.fillStyle = col;
      for (var i = -1; i < 12; i++) {
        var k = i + Math.floor(off / 44), r = rnd1(k * seed);
        var bw = 22 + Math.floor(r * 16), bh = 26 + r * tall;
        var bx = i * 44 - (off % 44);
        ctx.fillRect(bx, base - bh, bw, bh);
        if (lit) {
          ctx.fillStyle = "rgba(255,214,140,.5)";
          for (var wy = base - bh + 6; wy < base - 6; wy += 9)
            for (var wx = bx + 4; wx < bx + bw - 5; wx += 8)
              if (rnd1(wx * 3 + wy) > 0.55) ctx.fillRect(wx, wy, 3, 4);
          ctx.fillStyle = col;
        }
      }
    }
    function tower(x, base, h, w) {                                  // the tower with the dollar on it
      ctx.fillStyle = "#241a38"; ctx.fillRect(x, base - h, w, h);
      ctx.fillStyle = "rgba(255,214,140,.45)";
      for (var wy = base - h + 10; wy < base - 8; wy += 11)
        for (var wx = x + 5; wx < x + w - 6; wx += 9) ctx.fillRect(wx, wy, 4, 5);
      ctx.fillStyle = "#e8b45c"; ctx.font = "bold 22px monospace"; ctx.textAlign = "center";
      ctx.fillText("\u00A3", x + w / 2, base - h + 24);
    }
    // inside the tower: strip lights, partitions, and encouragement
    var POSTERS = ["SYNERGY", "HUSTLE", "ONE TEAM", "OWN IT", "THRIVE", "LEAN IN"];
    function office(off) {
      var g = ctx.createLinearGradient(0, 0, 0, GROUND);
      g.addColorStop(0, "#39405a"); g.addColorStop(1, "#252a3c");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND);
      ctx.fillStyle = "#1f2334"; ctx.fillRect(0, 0, W, 36);          // suspended ceiling
      for (var t = -(off * 0.9 % 46); t < W; t += 46) {              // ceiling tile joins
        ctx.fillStyle = "#2b3145"; ctx.fillRect(t, 0, 1.5, 36);
      }
      for (var L = -(off * 0.9 % 92); L < W; L += 92) {              // strip lights, clear of the HUD
        ctx.fillStyle = "#f6f2d8"; ctx.fillRect(L + 18, 26, 44, 5);
        ctx.fillStyle = "rgba(246,242,216,.18)"; ctx.fillRect(L + 12, 31, 56, 14);
      }
      for (var wx = -(off * 0.55 % 150); wx < W; wx += 150) {        // windows onto the night
        ctx.fillStyle = "#151a2e"; ctx.fillRect(wx + 16, 44, 62, 40);
        ctx.fillStyle = "#3a4468"; ctx.fillRect(wx + 16, 44, 62, 2);
        ctx.fillStyle = "rgba(255,214,140,.5)";
        for (var q = 0; q < 7; q++) ctx.fillRect(wx + 21 + (q * 8) % 54, 52 + (q % 3) * 10, 3, 4);
        ctx.fillStyle = "#2b3145"; ctx.fillRect(wx + 46, 44, 2, 40);
      }
      for (var px2 = -(off * 0.55 % 150); px2 < W; px2 += 150) {     // motivational posters
        var pt = POSTERS[Math.abs(Math.round((px2 + off * 0.55) / 150)) % POSTERS.length];
        ctx.fillStyle = "#e8e2d2"; ctx.fillRect(px2 + 104, 50, 34, 26);
        ctx.fillStyle = "#c0392b"; ctx.font = "bold 6px monospace"; ctx.textAlign = "center";
        ctx.fillText(pt, px2 + 121, 66);
      }
      for (var pz = -(off % 118); pz < W; pz += 118) {                // cubicle partitions
        ctx.fillStyle = "#4a5168"; ctx.fillRect(pz, GROUND - 52, 54, 52);
        ctx.fillStyle = "#3d4459"; ctx.fillRect(pz, GROUND - 52, 54, 4);
        ctx.fillStyle = "#20364a"; ctx.fillRect(pz + 10, GROUND - 40, 20, 14);   // a monitor, glowing
        ctx.fillStyle = "rgba(120,200,220,.5)"; ctx.fillRect(pz + 12, GROUND - 38, 16, 10);
      }
    }
    function lift(x, base, h, w) {                                   // the lift you need a pass for
      ctx.fillStyle = "#2f3548"; ctx.fillRect(x - 6, base - h - 8, w + 12, h + 8);
      ctx.fillStyle = "#9aa4b8"; ctx.fillRect(x, base - h, w, h);
      ctx.fillStyle = "#7c869c"; ctx.fillRect(x + w / 2 - 1, base - h, 2, h);
      ctx.fillStyle = "#161a26"; ctx.fillRect(x + w / 2 - 16, base - h - 20, 32, 13);
      ctx.fillStyle = "#e8b45c"; ctx.font = "bold 9px monospace"; ctx.textAlign = "center";
      ctx.fillText("\u25B2 40", x + w / 2, base - h - 10);
      ctx.fillStyle = "#c0392b"; ctx.fillRect(x + w - 14, base - h / 2 - 6, 10, 12);   // the card reader
    }
    function glassCeiling(y, cracks) {
      ctx.fillStyle = "rgba(180,225,235,.22)"; ctx.fillRect(0, y - 12, W, 12);
      ctx.fillStyle = "rgba(230,250,255,.5)"; ctx.fillRect(0, y - 1.5, W, 1.5);

        ctx.textAlign = "left"; ctx.font = "bold 11px monospace";
        ctx.fillStyle = money < 30 ? "#ff6b6b" : "#8fd08a";
        ctx.fillText("\u00A3" + Math.max(0, Math.round(money)), 6, 15);
        ctx.textAlign = "center"; ctx.fillStyle = "#e8b45c"; ctx.font = "bold 9px monospace";
        ctx.fillText(mode === "rigged" ? "RIGGED" : (c2.interior || lv >= 3 ? "FLOOR " + ["I","II","III","IV","V","VI"][Math.min(5, lv - 3)] : "LEVEL " + (lv + 1)), W / 2, 14);
        ctx.fillStyle = "rgba(243,230,200,.3)"; ctx.fillRect(W - 96, 8, 88, 7);
        ctx.fillStyle = "#e8b45c"; ctx.fillRect(W - 96, 8, 88 * Math.min(1, dist / c2.goal), 7);
        if (msgT > 0) {
          ctx.textAlign = "center"; ctx.fillStyle = "#ff9a9a"; ctx.font = "bold 13px monospace";
          ctx.fillText(msg, W / 2, 60);
        }
        if (flashT > 0) { ctx.fillStyle = "rgba(200,50,40," + (flashT / 34) + ")"; ctx.fillRect(0, 0, W, H); }
        if (scr === "win" || scr === "bust") {
          ctx.fillStyle = "rgba(8,5,14,.85)"; ctx.fillRect(0, 0, W, H);
          ctx.textAlign = "center";
          if (scr === "win" && mode === "rigged") {
            ctx.fillStyle = "#e8b45c"; ctx.font = "bold 17px monospace"; ctx.fillText("YOU WIN", W / 2, 76);
            ctx.fillStyle = "#f3e6c8"; ctx.font = "10px monospace";
            ctx.fillText("You were never running.", W / 2, 104);
            ctx.fillText("The floor moved for you.", W / 2, 120);
            ctx.fillText("Final worth: \u00A3" + Math.round(money).toLocaleString(), W / 2, 142);
          } else if (scr === "win") {
            ctx.fillStyle = "#e8b45c"; ctx.font = "bold 15px monospace"; ctx.fillText("THE CEILING HOLDS", W / 2, 66);
            ctx.fillStyle = "#f3e6c8"; ctx.font = "10px monospace";
            ctx.fillText("You reached the top of the tower.", W / 2, 92);
            ctx.fillText("The last floor is glass. You can see it:", W / 2, 108);
            ctx.fillText("a pass you cannot buy, a man who took", W / 2, 124);
            ctx.fillText("the lift, and " + ceilCracks + " cracks under review.", W / 2, 140);
            ctx.fillStyle = "#8fd08a"; ctx.font = "bold 11px monospace";
            ctx.fillText("You kept \u00A3" + Math.max(0, Math.round(money)), W / 2, 160);
          } else {
            ctx.fillStyle = "#ff6b6b"; ctx.font = "bold 16px monospace"; ctx.fillText("SKINT", W / 2, 80);
            ctx.fillStyle = "#f3e6c8"; ctx.font = "10px monospace";
            if (lv >= 3) {
              ctx.fillText("The costs caught up on floor " + ["I","II","III","IV","V","VI"][Math.min(5, lv - 3)] + ".", W / 2, 106);
              ctx.fillText("Your access card has been deactivated.", W / 2, 122);
              ctx.fillText("Someone from HR will be in touch. Or not.", W / 2, 138);
            } else {
              ctx.fillText("The costs caught up on level " + (lv + 1) + ".", W / 2, 106);
              ctx.fillText("Someone will mention avocado toast.", W / 2, 122);
            }
          }
          ctx.fillStyle = "#cfeecb"; ctx.font = "10px monospace";
          ctx.fillText("tap / space for the title screen", W / 2, 186);
        }
        crt();
      },
      pointer: function (x, y, type) {
        if (type !== "down") return;
        if (scr === "title") {
          if (inBtn(x, y, BL)) { mode = "worker"; lv = 0; scr = "brief"; Ambient.blip(660, 0.06, "triangle"); }
          else if (inBtn(x, y, BR)) { mode = "rigged"; lv = 0; scr = "brief"; Ambient.blip(880, 0.06, "triangle"); }
          return;
        }
        if (scr === "cut") {
          if (cutLine < CUTS[cut].lines.length - 1) { cutLine++; cutT = 0; }
          else { lv++; scr = "brief"; }
          return;
        }
        if (scr === "brief") { beginLevel(); return; }
        if (scr === "win" || scr === "bust") { reset(); return; }
        jump();
      },
      key: function (e) {
        if (e.key !== " " && e.code !== "Space" && e.key !== "Enter" && e.key !== "ArrowUp") return;
        e.preventDefault();
        if (scr === "title") { mode = "worker"; lv = 0; scr = "brief"; }
        else if (scr === "cut") {
          if (cutLine < CUTS[cut].lines.length - 1) { cutLine++; cutT = 0; }
          else { lv++; scr = "brief"; }
        }
        else if (scr === "brief") beginLevel();
        else if (scr === "win" || scr === "bust") reset();
        else jump();
      }
    };
  }

  // ---- harness: loop and input, lifted from the house's computer ----
  function loop() { if (!running) return; if (game) { game.update(); game.draw(); } raf = requestAnimationFrame(loop); }
  function xy(e) {
    var pt = e.touches ? e.touches[0] : e, r = canvas.getBoundingClientRect();
    return { x: (pt.clientX - r.left) / r.width * W, y: (pt.clientY - r.top) / r.height * H };
  }
  function onMove(e) { if (game && game.pointer) { var p = xy(e); game.pointer(p.x, p.y, "move"); } if (e.cancelable) e.preventDefault(); }
  function onDown(e) { if (game && game.pointer) { var p = xy(e); game.pointer(p.x, p.y, "down"); } if (e.cancelable) e.preventDefault(); }
  function onUp() { if (game && game.pointer) game.pointer(0, 0, "up"); }
  function onKey(e) { if (game && game.key) game.key(e); }
  function bindInput() {
    if (inputBound) return; inputBound = true;
    canvas.addEventListener("mousemove", onMove);
    canvas.addEventListener("touchmove", onMove, { passive: false });
    canvas.addEventListener("mousedown", onDown);
    canvas.addEventListener("touchstart", onDown, { passive: false });
    window.addEventListener("mouseup", onUp);
    window.addEventListener("touchend", onUp);
    window.addEventListener("keydown", onKey);
  }

  // ---- go ----
  function start() {
    if (raf) cancelAnimationFrame(raf);
    game = AntiCap(function (id, score) {
      if (score > getBest()) { setBest(score); paintBest(); }
    });
    document.getElementById("hint").textContent = game.hint;
    game.init(); bindInput(); running = true; loop();
  }

  document.getElementById("btnMute").addEventListener("click", Ambient.toggle);
  document.getElementById("btnRestart").addEventListener("click", start);
  // don't let space scroll the page while you're jumping
  window.addEventListener("keydown", function (e) {
    if ((e.key === " " || e.code === "Space") && e.target === document.body) e.preventDefault();
  });

  paintBest();
  Ambient.paintMute();
  start();
})();
</script>
